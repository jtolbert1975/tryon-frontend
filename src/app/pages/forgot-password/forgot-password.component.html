<div class="auth-container">
  <div class="auth-card">
    <h1>Reset Password</h1>

    @if (message()) {
      <div class="success-banner">{{ message() }}</div>
    }
    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <label>
      Email
      <input type="email" [(ngModel)]="email" name="email" autocomplete="email" />
    </label>

    <button type="button" (click)="onSubmit()" [disabled]="loading() || !email">
      {{ loading() ? 'Sending…' : 'Send reset link' }}
    </button>

    <p class="switch">
      <a routerLink="/login">Back to log in</a>
    </p>
  </div>
</div>
