<div class="auth-container">
  <div class="auth-card">
    <h1>Choose a New Password</h1>

    @if (!hasLink) {
      <div class="error-banner">This reset link is incomplete. Please request a new one.</div>
      <p class="switch"><a routerLink="/forgot-password">Request a new link</a></p>
    } @else {
      @if (message()) {
        <div class="success-banner">{{ message() }} Redirecting to log in…</div>
      }
      @if (error()) {
        <div class="error-banner">{{ error() }}</div>
      }

      <label>
        New password
        <input type="password" [(ngModel)]="password" name="password" autocomplete="new-password" />
      </label>

      <label>
        Confirm new password
        <input type="password" [(ngModel)]="passwordConfirmation" name="passwordConfirmation" autocomplete="new-password" />
      </label>

      <button type="button" (click)="onSubmit()" [disabled]="loading() || !!message()">
        {{ loading() ? 'Saving…' : 'Reset password' }}
      </button>

      <p class="switch">
        <a routerLink="/forgot-password">Request a new link</a>
      </p>
    }
  </div>
</div>
