<div class="auth-container">
    <div class="auth-card">
      <h1>Create Account</h1>
  
      @if (error()) {
        <div class="error-banner">{{ error() }}</div>
      }
  
      <label>
        Name
        <input type="text" [(ngModel)]="name" name="name" autocomplete="name" />
      </label>
  
      <label>
        Email
        <input type="email" [(ngModel)]="email" name="email" autocomplete="email" />
      </label>
  
      <label>
        Password
        <input type="password" [(ngModel)]="password" name="password" autocomplete="new-password" />
      </label>
  
      <label>
        Confirm Password
        <input type="password" [(ngModel)]="passwordConfirmation" name="password_confirmation" autocomplete="new-password" />
      </label>
  
      <button (click)="onSubmit()" [disabled]="loading()">
        {{ loading() ? 'Creating…' : 'Create Account' }}
      </button>
  
      <p class="switch">
        Already have an account? <a routerLink="/login">Log in</a>
      </p>
    </div>
  </div>
